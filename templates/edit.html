<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Edit Expense</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for kind, message in messages %}
    <div class="flash {{ kind }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form action="{{ url_for('edit_expense', expense_id=expense.id) }}" method="POST" data-loading-text="Saving...">
        <label>
            Amount
            <input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
        </label>

        <label>
            Category
            <select name="category" required>
                {% for c in categories %}
                <option value="{{ c }}" {% if c==expense.category %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Date
            <input type="date" name="date" value="{{ expense.date }}" required>
        </label>

        <button type="submit">Save</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>

    <script>
        document.querySelectorAll("form").forEach(form => {
            if (form.method !== "post") return;

            form.addEventListener("submit", event => {
                if (event.defaultPrevented) return;

                const button = form.querySelector("button[type='submit']");
                if (!button) return;

                button.disabled = true;
                button.textContent = form.dataset.loadingText || "Please wait...";
            });
        });

        // Reload if the user comes back with the Back button, so the button isn't stuck disabled
        window.addEventListener("pageshow", event => {
            if (event.persisted) location.reload();
        });
    </script>
</body>

</html>
