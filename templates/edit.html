<!DOCTYPE html>
<html>

<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Edit Expense</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for kind, message in messages %}
    <div class="flash {{ kind }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form action="{{ url_for('edit_expense', expense_id=expense.id) }}" method="POST">
        <label>
            Amount
            <input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
        </label>

        <label>
            Category
            <select name="category" required>
                {% for c in categories %}
                <option value="{{ c }}" {% if c==expense.category %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Date
            <input type="date" name="date" value="{{ expense.date }}" required>
        </label>

        <button type="submit">Save</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</body>

</html>
